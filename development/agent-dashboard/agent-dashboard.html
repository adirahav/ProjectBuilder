<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<title>Agent Dashboard</title>
<style>
  :root {
    --bg: #0b0b10;
    --panel: #16161d;
    --border: #2a2a35;
    --text: #e6e6ec;
    --dim: #6b6b7a;
    --orchestrator: #f0b429;
    --frontend: #d946ef;
    --backend: #3b82f6;
    --qa: #22c55e;
    --security: #06b6d4;
    --idle: #3a3a46;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto 1fr;
    height: 100vh;
    gap: 0;
  }
  #stage {
    position: relative;
    grid-column: 1;
    grid-row: 1 / span 2;
    display: flex;
    align-items: center;
    justify-content: center;
    border-right: 1px solid var(--border);
  }
  #ring { position: relative; width: min(70vh, 560px); height: min(70vh, 560px); }
  svg#beams { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .beam {
    stroke: var(--idle);
    stroke-width: 2;
    opacity: 0.25;
    transition: stroke 0.4s ease, opacity 0.4s ease, stroke-width 0.4s ease;
  }
  .beam.active {
    stroke-width: 3;
    opacity: 1;
    stroke-dasharray: 6 4;
    animation: dash 1s linear infinite;
  }
  @keyframes dash { to { stroke-dashoffset: -20; } }
  /* Every backend service beam routes through api-gateway in reality — this
     gives the gateway node/segment a static, non-pulsing tint whenever a
     service behind it is active but the gateway itself isn't the one named
     in scope, without claiming the gateway is doing its own work. */
  .beam.through { stroke: var(--backend); opacity: 0.55; stroke-width: 2.5; }
  .node.through { border-color: var(--backend); box-shadow: 0 0 10px rgba(59, 130, 246, 0.35); }

  .node {
    position: absolute;
    width: 96px; height: 96px;
    margin-left: -48px; margin-top: -48px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 50%;
    background: var(--panel);
    border: 2px solid var(--border);
    transition: box-shadow 0.4s ease, border-color 0.4s ease, transform 0.4s ease;
  }
  .node .icon { font-size: 30px; line-height: 1; }
  .node .icon-img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; display: block; filter: brightness(1.25) contrast(1.1) saturate(1.1); }
  .node .name { font-size: 10px; color: var(--dim); margin-top: 4px; text-align: center; max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node.center { width: 128px; height: 128px; margin-left: -64px; margin-top: -64px; }
  .node.center .icon { font-size: 42px; }
  .node.center .icon-img { width: 78px; height: 78px; }

  /* Backend-service satellites are deliberately smaller than the primary
     ring — the only way the 3 of them fit around gateway at a comparable
     relative distance without overlapping it or each other. */
  .node.satellite { width: 64px; height: 64px; margin-left: -32px; margin-top: -32px; }
  .node.satellite .icon { font-size: 20px; }
  .node.satellite .icon-img { width: 37px; height: 37px; }
  .node.satellite .name { font-size: 9px; max-width: 56px; margin-top: 2px; }

  .node.active {
    transform: scale(1.12);
    animation: pulse 1.4s ease-in-out infinite;
  }

  /* Idle-state separation — just a faint neutral border, no per-category glow.
     Color and glow are reserved entirely for .active below, so the eye goes
     straight to whoever's actually working instead of every node competing
     for attention at once. */
  .node[data-agent] { border-color: rgba(255, 255, 255, 0.14); }

  .node[data-agent="orchestrator"].active { border-color: var(--orchestrator); box-shadow: 0 0 24px var(--orchestrator); }
  .node[data-agent="frontend"].active     { border-color: var(--frontend);     box-shadow: 0 0 24px var(--frontend); }
  .node[data-agent="qa"].active           { border-color: var(--qa);           box-shadow: 0 0 24px var(--qa); }
  .node[data-agent="security"].active     { border-color: var(--security);     box-shadow: 0 0 24px var(--security); }
  .node[data-agent$="-service"].active,
  .node[data-agent="gateway"].active      { border-color: var(--backend);      box-shadow: 0 0 24px var(--backend); }

  @keyframes pulse {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.35); }
  }

  #sidebar {
    grid-column: 2; grid-row: 1;
    display: flex; flex-direction: column;
    padding: 20px 24px;
    overflow: hidden;
  }
  #status-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  #status-card .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status-card .agent-line { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .sidebar-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
  #status-card .message { margin-top: 10px; font-size: 14px; color: var(--text); line-height: 1.5; min-height: 3.2em; }
  #status-card .thinking { margin-top: 8px; font-size: 13px; font-style: italic; color: var(--dim); min-height: 1.2em; }
  #status-card .updated { margin-top: 10px; font-size: 11px; color: var(--dim); }

  #cost-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  #cost-card .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin-bottom: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #cost-table-wrap { overflow-x: auto; }
  #cost-table { width: 100%; border-collapse: collapse; font-size: 12px; white-space: nowrap; }
  #cost-table th { text-align: left; color: var(--dim); font-weight: 600; padding: 4px 8px 6px; border-bottom: 1px solid var(--border); }
  #cost-task-col { max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #cost-table td { padding: 4px 8px; border-bottom: 1px solid rgba(255,255,255,0.04); }
  #cost-table tr:last-child td { border-bottom: none; }
  #cost-table tr.total-row td { font-weight: 700; border-top: 1px solid var(--border); }
  #cost-total { margin-top: 10px; font-size: 12px; color: var(--dim); }
  #cost-total strong { color: var(--text); }
  #dot {
    width: 10px; height: 10px; border-radius: 50%; background: var(--idle);
    box-shadow: 0 0 0 rgba(0,0,0,0); transition: background 0.4s, box-shadow 0.4s;
  }
  #dot.live { background: #22c55e; box-shadow: 0 0 8px #22c55e; animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  #active-thinking { animation: thinkingPulse 3.2s ease-in-out infinite; }
  @keyframes thinkingPulse { 0%, 100% { color: var(--dim); } 50% { color: #35353f; } }

  #iframe-wrap {
    grid-column: 2; grid-row: 2;
    padding: 0 24px 20px;
    display: flex; flex-direction: column;
    flex: 1; min-height: 0;
  }
  #iframe-wrap .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin-bottom: 8px; }
  #app-frame {
    flex: 1; min-height: 0;
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #fff;
  }
  h1 {
    position: absolute; top: 16px; left: 24px;
    font-size: 14px; font-weight: 600; letter-spacing: 0.04em; color: var(--dim);
    margin: 0;
  }

  #sound-gate {
    position: fixed; inset: 0;
    background: rgba(11, 11, 16, 0.92);
    display: flex; align-items: center; justify-content: center;
    z-index: 50;
  }
  #enable-sound {
    font-size: 16px; font-weight: 600;
    padding: 16px 28px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
  }
  #enable-sound:hover { border-color: var(--orchestrator); }
</style>
</head>
<body>
<h1>👑 AGENT DASHBOARD</h1>
<div id="layout">
  <div id="stage">
    <div id="ring">
      <svg id="beams"></svg>
    </div>
  </div>

  <div id="sidebar">
    <div id="status-card">
      <div class="label"><span id="dot"></span> &nbsp;<span id="status-label">Live status</span></div>
      <div class="agent-line"><img id="active-icon-img" class="sidebar-avatar" src="/assets/orchestrator-agent.png" alt=""><span id="active-name">orchestrator</span></div>
      <div class="message" id="active-message">Waiting for the loop to start…</div>
      <div class="thinking" id="active-thinking"></div>
      <div class="updated" id="active-updated"></div>
    </div>

    <div id="cost-card">
      <div class="label" id="cost-label">💰 Cost — this task</div>
      <div id="cost-table-wrap">
        <table id="cost-table">
          <thead>
            <tr><th id="cost-task-col">Agent</th><th>In</th><th>Out</th><th>Cache</th><th>USD</th><th>NIS</th><th>Sec</th></tr>
          </thead>
          <tbody id="cost-tbody"></tbody>
        </table>
      </div>
      <div id="cost-total"></div>
    </div>
  </div>

  <div id="iframe-wrap">
    <div class="label">🌐 Live app — http://localhost:5173</div>
    <iframe id="app-frame" src="http://localhost:5173" title="Live app preview"></iframe>
  </div>
</div>

<div id="sound-gate">
  <button id="enable-sound">🔊 Click to enable voice cues</button>
</div>

<script>
// Two tiers: the primary ring sits around the orchestrator; the three
// backend services form a small satellite cluster around api-gateway
// instead of connecting straight to the orchestrator, since that's where
// their requests actually route through in the real architecture.
// Gateway sits on a diagonal (45°) rather than due-right — at the SAME
// radius as frontend/qa/security (see PRIMARY_RADIUS_PCT below), a due-right
// gateway leaves almost no room before the box edge for its own satellite
// cluster. The diagonal points toward a corner instead of an edge, which is
// ~2x further away from center in a square box — that's the only room the
// 3 backend-service satellites actually have to exist at a comparable
// distance from gateway to how far gateway itself sits from the orchestrator.
const PRIMARY_AGENTS = [
  { key: "frontend", angle: -90, icon: "🎨", img: "fronend-agent.png", name: "frontend" },
  { key: "gateway",  angle: 45,  icon: "🔧", img: "backend-agent.png", name: "api-gateway" },
  { key: "qa",       angle: 90,  icon: "🐛", img: "qa-agent.png",      name: "qa" },
  { key: "security", angle: 180, icon: "🛡️", img: "system-agent.png", name: "security" },
];
// angleOffset is relative to gateway's own angle (45°), not absolute.
const BACKEND_SERVICES = [
  { key: "booking-service",      angleOffset: -65, icon: "🔧", img: "backend-agent.png", name: "booking-service" },
  { key: "user-service",         angleOffset: 0,   icon: "🔧", img: "backend-agent.png", name: "user-service" },
  { key: "notification-service", angleOffset: 65,  icon: "🔧", img: "backend-agent.png", name: "notification-service" },
];
const AGENTS = [...PRIMARY_AGENTS, ...BACKEND_SERVICES];
const CENTER = { key: "orchestrator", icon: "👑", img: "orchestrator-agent.png", name: "orchestrator" };

// "Thinking..."-style ambient words shown under the current action while an

    "Iterating","Brainstorming","Ideating","Envisioning","Imagining","Conceptualizing","Drafting","Revising",

    "Checking for intrusion","Verifying a firewall rule","Scanning the network","Scanning ports","Checking exposure","Checking for data leaks","Scanning for PII","Checking compliance",

function randomThinkingTerm(category) {
  const list = THINKING_TERMS[category] || THINKING_TERMS.orchestrator;
  return list[Math.floor(Math.random() * list.length)];
}

let currentThinkingCategory = "orchestrator";
// Set true whenever the last known moment is one where nothing is actually
// being "thought" — waiting on the human (approval) or stuck (session limit /
// needs attention). The rotating terms would be misleading there, so they're
// suppressed until a real agent-start/agent-back moment resumes them.
let thinkingPaused = false;
const PAUSE_ON_EVENTS = new Set(["waiting-approval", "session-limit", "attention-needed"]);

function tickThinking() {
  const dot = document.getElementById("dot");
  const el = document.getElementById("active-thinking");
  if (!dot.classList.contains("live") || thinkingPaused) {
    el.textContent = "";
    return;
  }
  el.textContent = randomThinkingTerm(currentThinkingCategory) + "…";
}
setInterval(tickThinking, 3200);

// One category can cover several ring nodes (every backend service, no
// matter its real name, is the same "backend" voice/visual category) — so
// highlighting works by category, not by a single node key.
const CATEGORY_TO_KEYS = {
  frontend: ["frontend"],
  backend: ["gateway", "booking-service", "user-service", "notification-service"],
  qa: ["qa"],
  security: ["security"],
  orchestrator: ["orchestrator"],
};

// event -> audio file. "agent-start"/"agent-skip" additionally key off
// category (frontend/backend/qa/security) since those are the only ones
// with a per-category voice line.
const AUDIO_MAP = {
  "orchestrator-start": "orchestrator-start.mp3",
  "picking-next-task": "picking-next-task.mp3",
  "task-done": "task-done.mp3",
  "agent-back": "agent-orchestrator.mp3",
  "session-limit": "session-limit.mp3",
  "attention-needed": "attention-needed.mp3",
  "waiting-approval": "agent-waiting-approval.mp3",
  "agent-start:frontend": "agent-frontend.mp3",
  "agent-start:backend": "agent-backend.mp3",
  "agent-start:qa": "agent-qa.mp3",
  "agent-start:security": "agent-security.mp3",
  "agent-skip:frontend": "agent-frontend-skip.mp3",
  "agent-skip:backend": "agent-backend-skip.mp3",
  "agent-skip:qa": "agent-qa-skip.mp3",
  "agent-skip:security": "agent-security-skip.mp3",
};

function audioFileFor(event, category) {
  if (event === "agent-start" || event === "agent-skip") {
    return AUDIO_MAP[`${event}:${category}`] || null;
  }
  return AUDIO_MAP[event] || null;
}

let soundEnabled = false;
const audioCache = {};
// Track whichever cue is currently playing so a new one can cut it off first.
// Without this, waking the machine after it slept lets the browser's throttled
// polling catch up all at once — several missed events firing back-to-back —
// and their cues would otherwise all play on top of each other.
let currentAudio = null;
function playCue(fileName) {
  if (!soundEnabled || !fileName) return;
  if (currentAudio && !currentAudio.paused) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
  }
  if (!audioCache[fileName]) audioCache[fileName] = new Audio(`/assets/${fileName}`);
  const audio = audioCache[fileName];
  audio.currentTime = 0;
  currentAudio = audio;
  audio.play().catch(() => { /* still locked or file missing — ignore, not critical */ });
}

document.getElementById("enable-sound").addEventListener("click", () => {
  soundEnabled = true;
  document.getElementById("sound-gate").style.display = "none";
  // Play a near-silent cue synchronously inside the click handler — this is
  // what actually unlocks autoplay in most browsers, since the permission is
  // tied to a real user-gesture call stack, not just a boolean flag.
  const unlock = new Audio(`/assets/${AUDIO_MAP["orchestrator-start"]}`);
  unlock.volume = 0;
  unlock.play().catch(() => {});
});

const ring = document.getElementById("ring");
const beams = document.getElementById("beams");

// Percent-of-ring-box distances, tuned by hand (and checked numerically for
// overlap) — gateway sits at the SAME radius as the other primary agents,
// PRIMARY_RADIUS_PCT, matching their exact distance from the orchestrator.
// Its 3 backend-service satellites get their own smaller node size
// (SATELLITE_NODE_PX) so they can fit around it at SATELLITE_RADIUS_PCT
// without overlapping gateway, each other, or the box edge.
const PRIMARY_RADIUS_PCT = 36;
const SATELLITE_RADIUS_PCT = 18;
// Must match .node.satellite's width in the <style> above — the radius/angle
// spread here were hand-checked against this exact node size for overlap.
const SATELLITE_NODE_PX = 64;

function pointAt(cx, cy, radiusPct, angleDeg) {
  const rad = (angleDeg * Math.PI) / 180;
  return { x: cx + radiusPct * Math.cos(rad), y: cy + radiusPct * Math.sin(rad) };
}

function makeNode(agent, pos, isCenter, isSatellite) {
  const el = document.createElement("div");
  el.className = "node" + (isCenter ? " center" : "") + (isSatellite ? " satellite" : "");
  el.dataset.agent = agent.key;
  el.style.left = pos.x + "%";
  el.style.top = pos.y + "%";
  const iconHtml = agent.img
    ? `<img class="icon-img" src="/assets/${agent.img}" alt="${agent.name}" onerror="this.replaceWith(Object.assign(document.createElement('div'), {className: 'icon', textContent: '${agent.icon}'}))">`
    : `<div class="icon">${agent.icon}</div>`;
  el.innerHTML = `${iconHtml}<div class="name">${agent.name}</div>`;
  ring.appendChild(el);
  return el;
}

const centerPos = { x: 50, y: 50 };
makeNode(CENTER, centerPos, true);

function makeBeam(key, from, to) {
  const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
  line.setAttribute("class", "beam");
  line.setAttribute("id", "beam-" + key);
  line.setAttribute("x1", from.x + "%");
  line.setAttribute("y1", from.y + "%");
  line.setAttribute("x2", to.x + "%");
  line.setAttribute("y2", to.y + "%");
  beams.appendChild(line);
}

const nodePositions = {};
PRIMARY_AGENTS.forEach((agent) => {
  const pos = pointAt(centerPos.x, centerPos.y, PRIMARY_RADIUS_PCT, agent.angle);
  nodePositions[agent.key] = pos;
  makeNode(agent, pos, false, false);
  makeBeam(agent.key, centerPos, pos);
});

const gatewayPos = nodePositions["gateway"];
const gatewayAngle = PRIMARY_AGENTS.find((a) => a.key === "gateway").angle;
BACKEND_SERVICES.forEach((agent) => {
  const pos = pointAt(gatewayPos.x, gatewayPos.y, SATELLITE_RADIUS_PCT, gatewayAngle + agent.angleOffset);
  nodePositions[agent.key] = pos;
  makeNode(agent, pos, false, true);
  makeBeam(agent.key, gatewayPos, pos);
});

const ALL_KEYS = ["orchestrator", ...AGENTS.map(a => a.key)];
const BY_KEY = Object.fromEntries([CENTER, ...AGENTS].map(a => [a.key, a]));

// `keys` is the exact set of ring nodes to light up (from the server's
// `data.keys`) — NOT every node in the category. A task usually only has
// one or two backend services actually in scope; lighting up all four just
// because the category is "backend" would visually claim work is happening
// somewhere it isn't. `category` still drives which voice cue plays and
// which color the glow uses — only the "which nodes glow" question is keys-based.
function setActiveCategory(category, keys) {
  currentThinkingCategory = category || "orchestrator";
  const activeKeys = new Set(keys && keys.length ? keys : (CATEGORY_TO_KEYS[category] || []));
  ALL_KEYS.forEach((key) => {
    const isActive = activeKeys.has(key);
    const node = document.querySelector('.node[data-agent="' + key + '"]');
    if (node) node.classList.toggle("active", isActive);
    const beam = document.getElementById("beam-" + key);
    if (beam) beam.classList.toggle("active", isActive);
  });

  // A routed-through service is active but the gateway itself isn't named in
  // `keys` — tint the gateway node and its orchestrator-beam so the ring
  // still reads as "this went through the gateway", without pulsing it as
  // if the gateway is doing its own work.
  const throughGateway = BACKEND_SERVICES.some((s) => activeKeys.has(s.key)) && !activeKeys.has("gateway");
  const gatewayNode = document.querySelector('.node[data-agent="gateway"]');
  if (gatewayNode) gatewayNode.classList.toggle("through", throughGateway);
  const gatewayBeam = document.getElementById("beam-gateway");
  if (gatewayBeam) gatewayBeam.classList.toggle("through", throughGateway);

  // Label shows the first actually-active node's identity — accurate even
  // for "backend", where that's now whichever specific service(s) are
  // really in scope, not a generic stand-in.
  const repKey = activeKeys.size ? [...activeKeys][0] : category;
  const info = BY_KEY[repKey] || { icon: "🤖", img: null, name: category || "idle" };
  const iconImg = document.getElementById("active-icon-img");
  if (info.img) iconImg.src = `/assets/${info.img}`;
  document.getElementById("active-name").textContent = activeKeys.size > 1 ? `${info.name} +${activeKeys.size - 1}` : info.name;
}

let lastSeq = 0;

async function poll() {
  const dot = document.getElementById("dot");
  try {
    const res = await fetch("/status.json", { cache: "no-store" });
    const data = await res.json();
    dot.classList.add("live");

    // Live text/highlight — refreshed by every output line, tracks who's
    // talking right now.
    const category = data.category || "orchestrator";
    setActiveCategory(category, data.keys);
    thinkingPaused = !!(data.lastEvent && PAUSE_ON_EVENTS.has(data.lastEvent.event));
    document.getElementById("active-message").textContent = data.message || "…";
    document.getElementById("active-updated").textContent = data.updatedAt
      ? "Updated " + new Date(data.updatedAt).toLocaleTimeString()
      : "";

    // Task title folded into the existing label lines (no new element, no
    // extra height) — truncated with ellipsis via CSS if it's long.
    const taskLabel = document.getElementById("status-label");
    const costLabel = document.getElementById("cost-label");
    taskLabel.textContent = data.task ? `Live status — ${data.task}` : "Live status";
    costLabel.textContent = data.task ? `💰 Cost — ${data.task}` : "💰 Cost — this task";

    // Audio cue — driven ONLY by `lastEvent`, which routine output can never
    // overwrite (see emitEvent()'s comment in dev-loop.js). Only a genuinely
    // NEW event (seq increased since the last poll) plays — re-fetching the
    // same still-current event on the next poll must never replay its sound.
    // While muted, `lastSeq` must NOT advance past an unplayed event — only
    // the very first poll after page load (lastSeq === 0) gets baselined so
    // we don't dump the whole history the moment sound is enabled. Any event
    // that arrives while still muted stays "unseen" and plays as soon as the
    // user clicks enable, instead of being silently lost.
    const evt = data.lastEvent;
    if (evt && evt.seq !== lastSeq) {
      if (soundEnabled) {
        lastSeq = evt.seq;
        playCue(audioFileFor(evt.event, evt.category));
      } else if (lastSeq === 0) {
        lastSeq = evt.seq;
      }
    }

    renderCostTable(data.costLog || [], data.costTotalUsd || 0, data.costTotalNis || 0, data.task);
  } catch {
    dot.classList.remove("live");
  }
}

function renderCostTable(rows, totalUsd, totalNis, task) {
  const tbody = document.getElementById("cost-tbody");
  const totalEl = document.getElementById("cost-total");
  const taskCol = document.getElementById("cost-task-col");
  taskCol.textContent = task || "Agent";
  taskCol.title = task || "";
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="7" style="color: var(--dim); font-style: italic;">No agent calls yet</td></tr>';
    totalEl.textContent = "";
    return;
  }
  const sum = (key) => rows.reduce((acc, r) => acc + (r[key] || 0), 0);
  tbody.innerHTML = `
    <tr class="total-row">
      <td>TOTAL</td>
      <td>${sum("inputTokens")}</td>
      <td>${sum("outputTokens")}</td>
      <td>${sum("cacheReadTokens")}</td>
      <td>$${totalUsd.toFixed(4)}</td>
      <td>₪${totalNis.toFixed(4)}</td>
      <td>${sum("durationS").toFixed(1)}</td>
    </tr>
  `;
  totalEl.innerHTML = `<strong>${rows.length}</strong> call(s) — <strong>$${totalUsd.toFixed(4)}</strong> / <strong>₪${totalNis.toFixed(4)}</strong>`;
}

setActiveCategory("orchestrator");
poll();
setInterval(poll, 1000);
</script>
</body>
</html>
