<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dev Loop Desktop</title>
<style>
  :root {
    --bg: #0b0b10;
    --panel: #16161d;
    --border: #2a2a35;
    --text: #e6e6ec;
    --dim: #6b6b7a;
    --accent: #f0b429;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #layout { display: flex; flex-direction: column; height: 100vh; }

  /* Toolbar only appears once a project is actually selected — before that,
     the centered #welcome screen below is the sole entry point, so there's
     never two different-looking "pick a folder" affordances competing for
     attention (that's what made this unclear the first time around: a small
     button buried in a toolbar with no explanation of what it does). */
  #toolbar {
    display: none;
    align-items: center; gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-shrink: 0;
  }
  #toolbar.visible { display: flex; }
  #project-path { flex: 1; min-width: 0; font-size: 13px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button {
    font-size: 13px; font-weight: 600;
    padding: 7px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #1e1e28;
    color: var(--text);
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: default; }
  #status { font-size: 12px; color: var(--dim); padding: 0 16px; flex-shrink: 0; }
  #main-area { flex: 1; min-height: 0; position: relative; }

  /* Step 1 of the whole flow: pick where the project lives. Centered, big,
     with real explanatory copy — not a small toolbar button a first-time
     user has to guess the purpose of. */
  #welcome-screen {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
  }
  #welcome-screen.hidden { display: none; }
  #welcome-card { max-width: 480px; padding: 0 24px; }
  #welcome-card .step-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--accent); margin-bottom: 10px;
  }
  #welcome-card h1 { font-size: 22px; margin: 0 0 12px; }
  #welcome-card p { font-size: 14px; color: var(--dim); line-height: 1.6; margin: 0 0 24px; }
  #pick-btn-main {
    font-size: 15px; font-weight: 700;
    padding: 14px 28px;
    border-radius: 10px;
    border: 1px solid var(--accent);
    background: rgba(240, 180, 41, 0.12);
    color: var(--accent);
  }
  #pick-btn-main:hover { background: rgba(240, 180, 41, 0.2); }
  #welcome-error { margin-top: 16px; font-size: 13px; color: #f87171; }
  #welcome-error:empty { display: none; }

  #log {
    position: absolute; inset: 0;
    margin: 0; padding: 12px 16px;
    overflow-y: auto;
    font-family: "Cascadia Code", Consolas, monospace;
    font-size: 12px; line-height: 1.5;
    white-space: pre-wrap;
    color: #c8c8d0;
  }
  webview { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
  webview.active { display: inline-flex; }
  #log.hidden { display: none; }
</style>
</head>
<body>
<div id="layout">
  <div id="toolbar">
    <button id="pick-btn">Change Project Folder…</button>
    <span id="project-path">No project selected</span>
    <button id="start-btn" disabled>▶ Start</button>
    <button id="stop-btn" disabled>■ Stop</button>
  </div>
  <div id="status"></div>
  <div id="main-area">
    <div id="welcome-screen">
      <div id="welcome-card">
        <div class="step-label">Step 1</div>
        <h1>Where should your project live?</h1>
        <p>
          Pick a folder on your computer — an empty one for a brand-new project, or one you've
          used with this app before. Everything needed gets set up there for you.
        </p>
        <button id="pick-btn-main">📁 Select Project Folder…</button>
        <div id="welcome-error"></div>
      </div>
    </div>
    <pre id="log"></pre>
    <webview id="dashboard-view"></webview>
  </div>
</div>
<script src="renderer.js"></script>
</body>
</html>
