<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<title>Agent Dashboard</title>
<style>
  :root {
    --bg: #0b0b10;
    --panel: #16161d;
    --border: #2a2a35;
    --text: #e6e6ec;
    --dim: #6b6b7a;
    --orchestrator: #f0b429;
    --designer: #fb7185;
    --frontend: #d946ef;
    --backend: #3b82f6;
    --qa: #22c55e;
    --security: #06b6d4;
    --idle: #3a3a46;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto 1fr;
    height: 100vh;
    gap: 0;
  }
  /* A grid track's default minimum is its content's min-content width, not
     0 — so "1fr 1fr" alone isn't actually a rigid 50/50: wide content on
     one side (a long task title, a wide history row) can silently grow that
     column and squeeze the other one narrower. min-width: 0 on both grid
     children removes that implicit floor, so the 50/50 split holds no
     matter what either side's content does (it wraps/scrolls/clips inside
     its own half instead). */
  #stage {
    position: relative;
    grid-column: 1;
    grid-row: 1 / span 2;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-right: 1px solid var(--border);
  }
  #ring { position: relative; width: min(70vh, 560px); height: min(70vh, 560px); }
  svg#beams { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .beam {
    stroke: var(--idle);
    stroke-width: 2;
    opacity: 0.25;
    transition: stroke 0.4s ease, opacity 0.4s ease, stroke-width 0.4s ease;
  }
  .beam.active {
    stroke-width: 3;
    opacity: 1;
    stroke-dasharray: 6 4;
    animation: dash 1s linear infinite;
  }
  @keyframes dash { to { stroke-dashoffset: -20; } }

  .node {
    position: absolute;
    width: 96px; height: 96px;
    margin-left: -48px; margin-top: -48px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 50%;
    background: var(--panel);
    border: 2px solid var(--border);
    transition: box-shadow 0.4s ease, border-color 0.4s ease, transform 0.4s ease;
  }
  .node .icon { font-size: 30px; line-height: 1; }
  .node .icon-img { width: 92px; height: 92px; border-radius: 50%; object-fit: cover; display: block; filter: brightness(1.25) contrast(1.1) saturate(1.1); }
  /* The name label curves along the bottom rim of the circular portrait
     (a 0-100 square viewBox arc, see makeNode()'s comment) instead of
     sitting on a flat line — same idea for every node size, since the SVG
     viewBox scales proportionally with whatever pixel box it renders into. */
  .node .name-arc { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .node .name-arc text {
    font-size: 11px; font-weight: 700; letter-spacing: 0.01em;
    fill: aliceblue;
    paint-order: stroke;
    stroke: rgba(0, 0, 0, 0.6);
    stroke-width: 3px;
    stroke-linejoin: round;
  }
  .node.center { width: 128px; height: 128px; margin-left: -64px; margin-top: -64px; }
  .node.center .icon { font-size: 42px; }
  .node.center .icon-img { width: 124px; height: 124px; }

  /* Backend-service satellites — smaller than the primary ring so 4 of them
     fit around the backend hub without overlapping it, each other, or the
     box edge. Small shared portrait + 2-line label, both scaled down to
     still fit the tight 52px circle. */
  .node.satellite {
    width: 52px; height: 52px; margin-left: -26px; margin-top: -26px; padding: 3px;
    background: radial-gradient(circle at 32% 30%, rgba(59, 130, 246, 0.24), var(--panel) 72%);
  }
  .node.satellite .icon-img { width: 50px; height: 50px; margin-bottom: 1px; }
  /* Extra attribute selector to out-specificity the generic idle-border rule
     below (.node[data-agent]) — satellites keep their own static tint even
     while idle, instead of falling back to the plain gray border. */
  .node.satellite[data-agent] { border-color: rgba(59, 130, 246, 0.45); }
  /* Mini-service label sits BELOW the circle (outside the portrait), not
     overlaid on top of it — the base .name-arc rule fills/overlays the
     whole node, so satellites need their own smaller box positioned just
     under it instead. Fixed pixel width (not 100%) since the satellite
     circle itself is only 52px — the label plate is deliberately wider than
     the circle so a real service name has room to read. */
  .node.satellite .name-arc {
    inset: auto; left: 50%; top: 100%;
    width: 140px; height: 36px;
    margin-top: -28px;
    transform: translateX(-50%);
    overflow: visible;
  }
  .node.satellite .name-arc text { font-size: 10px; }

  .node.active {
    transform: scale(1.12);
    animation: pulse 1.4s ease-in-out infinite;
  }

  /* Idle-state separation — just a faint neutral border, no per-category glow.
     Color and glow are reserved entirely for .active below, so the eye goes
     straight to whoever's actually working instead of every node competing
     for attention at once. */
  .node[data-agent] { border-color: rgba(255, 255, 255, 0.14); }

  .node[data-agent="orchestrator"].active { border-color: var(--orchestrator); box-shadow: 0 0 24px var(--orchestrator); }
  .node[data-agent="designer"].active     { border-color: var(--designer);     box-shadow: 0 0 24px var(--designer); }
  .node[data-agent="frontend"].active     { border-color: var(--frontend);     box-shadow: 0 0 24px var(--frontend); }
  .node[data-agent="qa"].active           { border-color: var(--qa);           box-shadow: 0 0 24px var(--qa); }
  .node[data-agent="security"].active     { border-color: var(--security);     box-shadow: 0 0 24px var(--security); }
  /* .satellite covers every backend service regardless of its key/name —
     not a name-pattern guess like the old ".../-service"/"gateway" match,
     which broke the moment a service's key didn't happen to fit that shape. */
  .node.satellite.active,
  .node[data-agent="backend"].active      { border-color: var(--backend);      box-shadow: 0 0 24px var(--backend); }

  @keyframes pulse {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.35); }
  }

  /* Right side: LIVE STATUS is always visible at top (not a tab — it's the
     one thing you always want in view), followed by a tabbed area (Cost /
     Live App / Design) that gets the rest of the column's height — so the
     app/design preview iframe is no longer squeezed into small leftover
     space under a fixed status+history stack. */
  #right-panel {
    grid-column: 2; grid-row: 1 / span 2;
    display: flex; flex-direction: column;
    min-height: 0;
    min-width: 0;
    padding: 20px 24px;
  }
  #right-tabs {
    display: flex; gap: 6px;
    margin: 16px 0 14px;
    flex-shrink: 0;
  }
  .right-tab {
    font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
    padding: 6px 14px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--dim);
    cursor: pointer;
  }
  .right-tab.active { color: var(--text); border-color: var(--orchestrator); box-shadow: 0 0 10px rgba(240, 180, 41, 0.25); }
  .right-tab-panel { display: none; flex-direction: column; min-height: 0; flex: 1; }
  .right-tab-panel.active { display: flex; }
  #status-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    flex-shrink: 0;
  }
  /* padding-right reserves room for #sound-toggle, a `position: fixed`
     element that floats on top of this line (z-index 50) instead of taking
     up space in normal document flow — without this, the label's own
     nowrap/ellipsis truncation has no idea the button is there, so it
     renders text right up to the card's real edge and the button just
     visually covers/cuts off whatever ends up underneath it. */
  #status-card .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 170px; }
  #status-card .agent-line { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .sidebar-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
  #status-card .message { margin-top: 10px; font-size: 14px; color: var(--text); line-height: 1.5; }
  #status-card .thinking { margin-top: 8px; font-size: 13px; font-style: italic; color: var(--dim); min-height: 1.2em; margin-bottom:2.0em }
  #status-card .updated { margin-top: 10px; font-size: 11px; color: var(--dim); }

  #session-limit-banner {
    margin-top: 12px; padding: 8px 12px;
    border-radius: 8px;
    background: rgba(240, 180, 41, 0.12);
    border: 1px solid rgba(240, 180, 41, 0.35);
    color: var(--orchestrator);
    font-size: 13px; font-weight: 600;
  }
  #session-limit-banner:empty { display: none; }

  /* Lets a human answer the terminal's blocking prompt (session-limit retry,
     design-review APPROVED/feedback, etc.) from the dashboard instead of
     having to switch to the terminal window. Two distinct modes, driven by
     /status.json's awaitingInput.expectsText (see askUserInput() in
     dev-loop.js) — NOT always both a textbox and a button: a "fix it, then
     press Enter to retry exactly where it stopped" prompt never reads the
     answer text at all, so showing an empty textbox next to it was actively
     misleading (looked like typing something would matter, when only the
     press itself does). `.text-mode`/`.enter-mode` on #respond-box (set in
     poll(), see below) toggle which controls are visible; hidden entirely
     until /status.json reports awaitingInput at all. */
  #respond-box {
    display: none;
    margin-top: 12px; padding: 12px;
    border-radius: 10px;
    background: rgba(240, 180, 41, 0.08);
    border: 1px solid rgba(240, 180, 41, 0.3);
  }
  #respond-box.active { display: block; }
  #respond-box:not(.text-mode) #respond-text,
  #respond-box:not(.text-mode) #respond-send { display: none; }
  #respond-box:not(.enter-mode) #respond-continue { display: none; }
  #respond-prompt { font-size: 12px; color: var(--text); margin-bottom: 8px; line-height: 1.5; white-space: pre-wrap; }
  #respond-controls { display: flex; gap: 6px; }
  #respond-text {
    flex: 1; min-width: 0;
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
  }
  #respond-text:focus { outline: none; border-color: var(--orchestrator); }
  #respond-send, #respond-continue {
    font-size: 12px; font-weight: 600;
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
  }
  #respond-continue { flex: 1; color: var(--orchestrator); border-color: rgba(240, 180, 41, 0.4); }
  #respond-send:hover, #respond-continue:hover { border-color: var(--orchestrator); }
  #respond-send:disabled, #respond-continue:disabled { opacity: 0.5; cursor: default; }

  .progress-badge {
    display: inline-block;
    font-size: 10px; font-weight: 700; letter-spacing: normal; text-transform: none;
    padding: 1px 7px;
    border-radius: 10px;
    background: rgba(240, 180, 41, 0.18);
    color: var(--orchestrator);
    vertical-align: middle;
  }
  .progress-badge:empty { display: none; }
  #status-task-name { text-transform: none; letter-spacing: normal; color: var(--text); font-weight: 600; }

  #history-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    overflow: hidden;
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
  }
  #history-card .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin-bottom: 8px; flex-shrink: 0; }
  #cost-summary {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 10px 12px; margin-bottom: 12px;
    border-radius: 10px;
    background: rgba(240, 180, 41, 0.08);
    border: 1px solid rgba(240, 180, 41, 0.25);
    font-size: 12px; color: var(--dim);
    flex-shrink: 0;
  }
  #cost-summary:empty { display: none; }
  #cost-summary-total { font-size: 18px; font-weight: 700; color: var(--orchestrator); }
  /* The Cost tab now has the whole tab panel's height to work with (not a
     cramped 100px sliver above the iframe like before) — so its own
     scrollbar only kicks in once the history genuinely outgrows that. */
  #history-list { flex: 1; min-height: 0; overflow-y: auto; font-size: 12px; }
  #history-table { width: 100%; border-collapse: collapse; }
  #history-table th { text-align: left; color: var(--dim); font-weight: 600; padding: 4px 8px 6px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--panel); }
  #history-table th:last-child, #history-table td:last-child { text-align: right; }
  #history-table td { padding: 4px 8px; border-bottom: 1px solid rgba(255,255,255,0.04); color: var(--text); }
  #history-table td:first-child { max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #history-table tr:last-child td { border-bottom: none; }
  #history-empty { color: var(--dim); font-style: italic; font-size: 12px; }
  #dot {
    width: 10px; height: 10px; border-radius: 50%; background: var(--idle);
    box-shadow: 0 0 0 rgba(0,0,0,0); transition: background 0.4s, box-shadow 0.4s;
  }
  #dot.live { background: #22c55e; box-shadow: 0 0 8px #22c55e; animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  #active-thinking { animation: thinkingPulse 3.2s ease-in-out infinite; }
  @keyframes thinkingPulse { 0%, 100% { color: var(--dim); } 50% { color: #35353f; } }

  .panel-header {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin-bottom: 8px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    flex-shrink: 0;
  }
  .panel-refresh {
    font-size: 11px; font-weight: 600; text-transform: none; letter-spacing: normal;
    padding: 3px 10px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
  }
  .panel-refresh:hover { border-color: var(--orchestrator); }
  #mockup-select {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
  }
  .panel-frame {
    flex: 1; min-height: 0;
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #fff;
  }
  h1 {
    position: absolute; top: 16px; left: 24px;
    font-size: 14px; font-weight: 600; letter-spacing: 0.04em; color: var(--dim);
    margin: 0;
  }

  /* A small always-visible toggle, not a blocking overlay — the page and
     everything on it is usable immediately; this just switches voice cues
     on/off, same as any mute button. The very first click still doubles as
     the browser's required user-gesture to unlock autoplay. */
  #sound-toggle {
    position: fixed; top: 16px; right: 24px; z-index: 50;
    font-size: 13px; font-weight: 600;
    padding: 8px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
  }
  #sound-toggle:hover { border-color: var(--orchestrator); }
</style>
</head>
<body>
<h1>👑 AGENT DASHBOARD</h1>
<div id="layout">
  <div id="stage">
    <div id="ring">
      <svg id="beams"></svg>
    </div>
  </div>

  <div id="right-panel">
    <div id="status-card">
      <div class="label"><span id="dot"></span> &nbsp;<span id="status-label">Live status</span> <span id="status-progress" class="progress-badge"></span> <span id="status-task-name"></span></div>
      <div class="agent-line"><img id="active-icon-img" class="sidebar-avatar" src="/assets/images/orchestrator-agent.png" alt=""><span id="active-name">orchestrator</span></div>
      <div class="message" id="active-message">Waiting for the loop to start…</div>
      <div class="thinking" id="active-thinking"></div>
      <div class="updated" id="active-updated"></div>
      <div id="session-limit-banner"></div>
      <div id="respond-box">
        <div id="respond-prompt"></div>
        <div id="respond-controls">
          <input type="text" id="respond-text" placeholder="Type feedback/notes…" autocomplete="off">
          <button id="respond-send">Send</button>
          <button id="respond-continue">▶ Continue</button>
        </div>
      </div>
    </div>

    <div id="right-tabs">
      <button class="right-tab active" id="tab-cost" data-panel="panel-cost">📜 Cost</button>
      <button class="right-tab" id="tab-liveapp" data-panel="panel-liveapp">🌐 Live App</button>
      <button class="right-tab" id="tab-design" data-panel="panel-design" style="display:none">🖌️ Design</button>
    </div>

    <div class="right-tab-panel active" id="panel-cost">
      <div id="history-card">
        <div class="label">📜 Task History</div>
        <div id="cost-summary"></div>
        <div id="history-list">
          <table id="history-table">
            <thead><tr><th>Task</th><th>USD</th></tr></thead>
            <tbody id="history-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="right-tab-panel" id="panel-liveapp">
      <div class="panel-header">
        http://localhost:5173
        <button id="iframe-refresh" class="panel-refresh" title="Reload the preview">↻ Refresh</button>
      </div>
      <iframe class="panel-frame" id="app-frame" src="http://localhost:5173" title="Live app preview"></iframe>
    </div>

    <div class="right-tab-panel" id="panel-design">
      <div class="panel-header">
        <select id="mockup-select"></select>
        <button id="mockup-refresh" class="panel-refresh" title="Reload the preview">↻ Refresh</button>
      </div>
      <iframe class="panel-frame" id="mockup-frame" title="Design mockup preview"></iframe>
    </div>
  </div>
</div>

<button id="sound-toggle">🔇 Enable voice cues</button>

<script>
// Primary ring: one portrait node per category, "backend" standing in for
// all backend work generically (matching frontend/qa/security) — these 4
// are fixed system roles, not per-project data. The real backend SERVICES
// (however many the current project actually has) are plain text badges
// branching off "backend" — no portrait needed, the hub's portrait already
// carries the "this is backend work" identity. That list is fetched from
// the server at load time (see initDashboard() below) instead of hardcoded,
// so a project with different/more/fewer services just works.
// Angles are assigned dynamically (see assignPrimaryAngles() below) so the
// ring stays evenly spaced no matter how many primary agents this array ends
// up with — never hardcode an `angle` field here again. Order here is still
// meaningful: it's the clockwise order they're placed in, starting at
// PRIMARY_ANGLE_START, and it's also read as the real pipeline order
// (Designer runs once, before anything else, then frontend/backend/qa/security).
const PRIMARY_AGENTS = [
  { key: "designer", icon: "🖌️", img: "designer-agent.png", name: "designer" },
  { key: "frontend", icon: "🎨", img: "fronend-agent.png", name: "frontend" },
  { key: "backend",  icon: "🔧", img: "backend-agent.png", name: "backend" },
  { key: "qa",       icon: "🐛", img: "qa-agent.png",      name: "qa" },
  { key: "security", icon: "🛡️", img: "security-agent.png", name: "security" },
];
// Matches the old fixed "designer" angle so the existing layout is unchanged
// for the current 5-agent set; a different agent count just redistributes
// the 360° evenly from this same starting point.
const PRIMARY_ANGLE_START = -135;
function assignPrimaryAngles() {
  const step = 360 / PRIMARY_AGENTS.length;
  PRIMARY_AGENTS.forEach((agent, i) => {
    agent.angle = PRIMARY_ANGLE_START + i * step;
  });
}
assignPrimaryAngles();
const CENTER = { key: "orchestrator", icon: "👑", img: "orchestrator-agent.png", name: "orchestrator" };

// Breaks a kebab-case service key into a 2-line ring label at its first
// hyphen (e.g. "notification-service" -> "notification-<br>service") — left
// to CSS auto-wrap instead, a long single word wrapped mid-letter into an
// illegible ellipsis. Keys without a hyphen render on one line as-is.
function serviceRingLabel(key) {
  // Break at the LAST hyphen, not the first — "user-management-service"
  // should read "user-management" / "service", not "user-" / "management-
  // service". Splitting at the first hyphen instead orphans a bare "user-"
  // on its own line and buries the actual last word ("service") in the
  // middle of line two.
  const lastDash = key.lastIndexOf("-");
  return lastDash === -1 ? key : `${key.slice(0, lastDash)}<br>${key.slice(lastDash + 1)}`;
}

// Populated once the real per-project service list is fetched — see
// initDashboard(). Declared here (not const) because everything below that
// references them runs only after that fetch resolves.
let BACKEND_SERVICES = [];
let AGENTS = [...PRIMARY_AGENTS];

// "Thinking..."-style ambient words shown under the current action while an
// agent is busy — a themed replacement for the terminal's plain heartbeat
// dots. One random word per tick, from the active category's own set.
const THINKING_TERMS = {
  designer: [
    "Sketching","Moodboarding","Palette-picking","Font-pairing","Establishing tokens","Composing","Balancing","Whitespacing",
    "Aligning grid","Choosing a scale","Setting hierarchy","Contrasting","Harmonizing","Theming","Shading","Gradient-mapping",
    "Mocking up","Wireframing","Prototyping","Iterating","Refining","Comparing options","Cropping","Framing",
    "Considering hierarchy","Weighing contrast","Checking legibility","Building a system","Naming a color","Tuning spacing","Polishing","Studying references",
  ],
  orchestrator: [
    "Thinking","Planning","Coordinating","Delegating","Reviewing","Prioritizing","Sequencing","Orchestrating",
    "Deciding","Evaluating","Scheduling","Dispatching","Organizing","Strategizing","Assessing","Weighing",
    "Balancing","Directing","Managing","Overseeing","Synchronizing","Aligning","Routing","Allocating",
    "Arbitrating","Negotiating","Mediating","Steering","Guiding","Supervising","Monitoring","Tracking",
    "Auditing","Verifying","Confirming","Approving","Queuing","Processing","Analyzing","Considering",
    "Pondering","Reflecting","Calculating","Estimating","Forecasting","Projecting","Ranking","Sorting",
    "Filtering","Selecting","Choosing","Comparing","Contrasting","Cross-checking","Validating","Reconciling",
    "Consolidating","Summarizing","Reporting","Logging","Recording","Documenting","Archiving","Distributing",
    "Branching","Merging","Committing","Escalating","Deferring","Resuming","Watching","Observing",
    "Inspecting","Diagnosing","Troubleshooting","Resolving","Untangling","Streamlining","Optimizing","Refining",

function randomThinkingTerm(category) {
  const list = THINKING_TERMS[category] || THINKING_TERMS.orchestrator;
  return list[Math.floor(Math.random() * list.length)];
}

// Set true whenever the last known moment is one where nothing is actually
// being "thought" — waiting on the human (approval) or stuck (session limit /
// needs attention). The rotating terms would be misleading there, so they're
// suppressed until a real agent-start/agent-back moment resumes them.
let thinkingPaused = false;
const PAUSE_ON_EVENTS = new Set(["waiting-approval", "session-limit", "attention-needed", "task-done"]);

function tickThinking() {
  const dot = document.getElementById("dot");
  const el = document.getElementById("active-thinking");
  if (!dot.classList.contains("live") || thinkingPaused) {
    el.textContent = "";

  el.textContent = randomThinkingTerm(currentThinkingCategory) + "…";
}

let soundEnabled = false;
const audioCache = {};
// Track whichever cue is currently playing so a new one can cut it off first.
// Without this, waking the machine after it slept lets the browser's throttled
// polling catch up all at once — several missed events firing back-to-back —
// and their cues would otherwise all play on top of each other.
let currentAudio = null;
function playCue(fileName) {
  if (!soundEnabled || !fileName) return;
  if (currentAudio && !currentAudio.paused) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
  }
  if (!audioCache[fileName]) audioCache[fileName] = new Audio(`/assets/audio/${fileName}`);
  const audio = audioCache[fileName];
  audio.currentTime = 0;
  currentAudio = audio;
  audio.play().catch(() => { /* still locked or file missing — ignore, not critical */ });
}

const soundToggleBtn = document.getElementById("sound-toggle");
let audioUnlocked = false;
soundToggleBtn.addEventListener("click", () => {
  soundEnabled = !soundEnabled;
  soundToggleBtn.textContent = soundEnabled ? "🔊 Voice cues on" : "🔇 Enable voice cues";
  if (soundEnabled && !audioUnlocked) {
    // Play a near-silent cue synchronously inside the click handler — this is
    // what actually unlocks autoplay in most browsers, since the permission
    // is tied to a real user-gesture call stack, not just a boolean flag.
    // Only needs doing once per page load, not on every re-enable.
    audioUnlocked = true;
    const unlock = new Audio(`/assets/audio/${AUDIO_MAP["orchestrator-start"]}`);
    unlock.volume = 0;
    unlock.play().catch(() => {});
  }
});

// Answers dev-loop.js's currently-blocking terminal prompt from here — POSTs
// to /respond, which resolves the SAME pendingHumanInput the terminal's own
// readline is waiting on (see dev-loop.js's askUserInput()). Empty text is a
// legitimate answer (equivalent to bare Enter), so this always sends
// whatever it's given rather than treating "" as "don't send."
async function sendRespond(text) {
  const sendBtn = document.getElementById("respond-send");
  const continueBtn = document.getElementById("respond-continue");
  sendBtn.disabled = true;
  continueBtn.disabled = true;
  try {
    await fetch("/respond", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    document.getElementById("respond-text").value = "";
  } catch {
    // Dashboard server hiccup — the terminal prompt is still live and can
    // still be answered directly there; nothing more to do here.
  } finally {
    sendBtn.disabled = false;
    continueBtn.disabled = false;
  }
}
document.getElementById("respond-send").addEventListener("click", () => {
  sendRespond(document.getElementById("respond-text").value);
});
document.getElementById("respond-continue").addEventListener("click", () => {
  sendRespond("");
});
document.getElementById("respond-text").addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendRespond(e.target.value);
});

document.getElementById("iframe-refresh").addEventListener("click", async () => {
  const btn = document.getElementById("iframe-refresh");
  const frame = document.getElementById("app-frame");
  btn.disabled = true;
  btn.textContent = "Starting…";
  try {
    // Server-side: no-ops if something's already answering on the frontend
    // URL, otherwise spawns `npm run dev` for it — same check-then-spawn
    // logic dev-loop.js runs at startup, just triggerable on demand here.
    await fetch("/ensure-frontend", { method: "POST" });
  } catch {
    // Dashboard server itself unreachable — reload attempt below will just
    // fail the same way the iframe already has; nothing more to do here.
  }
  // Re-assigning src (not frame.contentWindow.location.reload()) works even
  // when the previous load failed outright ("refused to connect") — a
  // failed load has no same-origin document to reload the other way.
  frame.src = frame.src;
  btn.disabled = false;
  btn.textContent = "↻ Refresh";
});

const ring = document.getElementById("ring");
const beams = document.getElementById("beams");

// Percent-of-ring-box distances, hand-tuned and checked numerically for
// overlap. The primary ring (frontend/backend/qa/security) sits at
// PRIMARY_RADIUS_PCT around the orchestrator; the 4 backend-service badges
// fan out from the backend hub at SATELLITE_RADIUS_PCT.
const PRIMARY_RADIUS_PCT = 36;
// The backend hub sits closer in than the other 3 primary nodes — pulling it
// in is the only way its 4-badge satellite cluster has room to exist without
// running off the box edge (verified numerically, not just eyeballed).
const HUB_RADIUS_PCT = 33.5;
const SATELLITE_RADIUS_PCT = 18;
// Must match .node.satellite's width in the <style> above.
const SATELLITE_NODE_PX = 52;

function pointAt(cx, cy, radiusPct, angleDeg) {
  const rad = (angleDeg * Math.PI) / 180;
  return { x: cx + radiusPct * Math.cos(rad), y: cy + radiusPct * Math.sin(rad) };
}

// Every node's name now curves along the bottom rim of its own circular
// portrait — like a badge/seal label — instead of sitting on a flat line.
// The arc path is defined in a 0-100 square viewBox, so it scales correctly
// for every node size (center/primary/satellite) without needing a
// per-size variant: SVG maps that viewBox onto whatever pixel box the
// element actually renders at, and a fixed user-unit font-size scales
// proportionally right along with it.
function escapeXml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&apos;" }[c]));
}

function makeNode(agent, pos, isCenter, isSatellite) {
  const el = document.createElement("div");
  el.className = "node" + (isCenter ? " center" : "") + (isSatellite ? " satellite" : "");
  el.dataset.agent = agent.key;
  el.style.left = pos.x + "%";
  el.style.top = pos.y + "%";
  const iconHtml = agent.img
    ? `<img class="icon-img" src="/assets/images/${agent.img}" alt="${agent.name}" onerror="this.replaceWith(Object.assign(document.createElement('div'), {className: 'icon', textContent: '${agent.icon}'}))">`
    : agent.icon
      ? `<div class="icon">${agent.icon}</div>`
      : "";
  const arcId = `name-arc-path-${agent.key}`;
  // Primary/center nodes: label curves along the bottom rim, overlaid ON the
  // portrait (viewBox matches the node's own 0-100 square) — single line.
  //
  // Mini-service satellites: the circle is tiny (52px) and several sit close
  // together in a fan — a label overlaid on the portrait there is nearly
  // unreadable, so it renders BELOW the circle instead, as two stacked
  // curved lines (splitting on ringLabel's own first-hyphen <br>, e.g.
  // "user-" / "management-service") rather than one cramped line — a real
  // service name doesn't fit legibly on a single short arc no matter how
  // wide the plate gets. Both arcs share the same tight radius (a
  // pronounced bow, not the earlier near-flat curve) and `overflow="visible"`
  // (both here and in CSS) lets a still-too-long line spill past the
  // plate's edges instead of being hard-clipped mid-word.
  const nameSvg = isSatellite
    ? (() => {
        const [line1, line2] = (agent.ringLabel || agent.name).split(/<br>\s*/).map((s) => escapeXml(s || ""))
        const arcId2 = `${arcId}-2`
        return `
    <svg class="name-arc" viewBox="0 0 140 36" overflow="visible">
      <path id="${arcId}" d="M8,-20 A80,160 0 0 0 132,-20" fill="none"></path>
      <text><textPath href="#${arcId}" startOffset="50%" text-anchor="middle">${line1}</textPath></text>
      ${line2 ? `<text><textPath href="#${arcId2}" startOffset="50%" text-anchor="middle">${line2}</textPath></text>` : ""}
    </svg>`
      })()
    : `
    <svg class="name-arc" viewBox="0 0 100 100">
      <path id="${arcId}" d="M10,80 A80,120 0 0 0 90,80" fill="none"></path>
      <text><textPath href="#${arcId}" startOffset="50%" text-anchor="middle">${escapeXml(agent.ringLabel || agent.name)}</textPath></text>
    </svg>`;
  el.innerHTML = `${iconHtml}${nameSvg}`;
  ring.appendChild(el);
  return el;
}

// Shifted left of true-center (not 50) — the only way to buy the backend
// cluster more room on the right without shrinking the orchestrator-backend
// gap. Checked numerically: 46.5 is the most it can shift before "security"
// on the left starts clipping the box edge.
const centerPos = { x: 46.5, y: 50 };
makeNode(CENTER, centerPos, true, false);

function makeBeam(key, from, to) {
  const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
  line.setAttribute("class", "beam");
  line.setAttribute("id", "beam-" + key);
  line.setAttribute("x1", from.x + "%");
  line.setAttribute("y1", from.y + "%");
  line.setAttribute("x2", to.x + "%");
  line.setAttribute("y2", to.y + "%");
  beams.appendChild(line);
}

const nodePositions = {};
let ALL_KEYS = ["orchestrator", ...AGENTS.map((a) => a.key)];
let BY_KEY = Object.fromEntries([CENTER, ...AGENTS].map((a) => [a.key, a]));

// Angle spacing between adjacent satellites — verified numerically for the
// 4-service case (offsets end up -120/-40/40/120, matching the layout this
// was hand-tuned against). Holds up reasonably for 1-4 services; a project
// with 5+ backend services will need this re-checked for overlap, since the
// satellites would start wrapping back around toward the primary ring.
const SATELLITE_ANGLE_STEP = 80;

// 13 generic backend-service portrait variants, assigned one-per-service
// (see initDashboard() below) so a project with several services doesn't
// show the same face on every satellite badge.
const MICRO_SERVICE_PORTRAITS = Array.from({ length: 13 }, (_, i) => `micro-service-agent${i + 1}.png`);

function shuffle(arr) {
  const copy = arr.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

// Fetches this project's actual backend-service list from the server (see
// the /status.json route in dev-loop.js, which injects `services` fresh
// from a live backend/ directory scan) and builds the ring around whatever
// that turns out to be — no service list hardcoded client-side.
async function initDashboard() {
  let services = [];
  try {
    const res = await fetch("/status.json", { cache: "no-store" });
    const data = await res.json();
    services = Array.isArray(data.services) ? data.services : [];
  } catch {
    // Dashboard server not reachable yet — ring just stays empty (backend
    // hub with no satellites) until a later poll() successfully retries.
  }

  // 13 generic portrait variants — shuffled once here so each backend
  // service gets a visually distinct one (no repeats, up to 13 services;
  // cycles gracefully rather than crashing if a project somehow has more).
  const shuffledPortraits = shuffle(MICRO_SERVICE_PORTRAITS);
  BACKEND_SERVICES = services.map((key, i, arr) => ({
    key,
    angleOffset: (i - (arr.length - 1) / 2) * SATELLITE_ANGLE_STEP,
    name: key,
    ringLabel: serviceRingLabel(key),
    img: shuffledPortraits[i % shuffledPortraits.length],
  }));
  AGENTS = [...PRIMARY_AGENTS, ...BACKEND_SERVICES];
  CATEGORY_TO_KEYS.backend = BACKEND_SERVICES.map((s) => s.key);
  ALL_KEYS = ["orchestrator", ...AGENTS.map((a) => a.key)];
  BY_KEY = Object.fromEntries([CENTER, ...AGENTS].map((a) => [a.key, a]));

  PRIMARY_AGENTS.forEach((agent) => {
    const radius = agent.key === "backend" ? HUB_RADIUS_PCT : PRIMARY_RADIUS_PCT;
    const pos = pointAt(centerPos.x, centerPos.y, radius, agent.angle);
    nodePositions[agent.key] = pos;
    makeNode(agent, pos, false, false);
    makeBeam(agent.key, centerPos, pos);
  });

  const hubPos = nodePositions["backend"];
  const hubAngle = PRIMARY_AGENTS.find((a) => a.key === "backend").angle;
  BACKEND_SERVICES.forEach((agent) => {
    const pos = pointAt(hubPos.x, hubPos.y, SATELLITE_RADIUS_PCT, hubAngle + agent.angleOffset);
    nodePositions[agent.key] = pos;
    makeNode(agent, pos, false, true);
    makeBeam(agent.key, hubPos, pos);
  });
}

// `keys` is the exact set of ring nodes to light up (from the server's
// `data.keys`) — NOT every node in the category. A task usually only has
// one or two backend services actually in scope; lighting up all four just
// because the category is "backend" would visually claim work is happening
// somewhere it isn't. `category` still drives which voice cue plays and
// which color the glow uses — only the "which nodes glow" question is keys-based.
function setActiveCategory(category, keys) {
  currentThinkingCategory = category || "orchestrator";
  const activeKeys = new Set(keys && keys.length ? keys : (CATEGORY_TO_KEYS[category] || []));
  // The hub is a pure category node (not a real running service) — light it
  // up in step with whichever specific backend service is actually active,
  // so the orchestrator→backend beam and hub glow track real work too.
  if (BACKEND_SERVICES.some((s) => activeKeys.has(s.key))) activeKeys.add("backend");
  ALL_KEYS.forEach((key) => {
    const isActive = activeKeys.has(key);
    const node = document.querySelector('.node[data-agent="' + key + '"]');
    if (node) node.classList.toggle("active", isActive);
    const beam = document.getElementById("beam-" + key);
    if (beam) beam.classList.toggle("active", isActive);
  });

  // Label shows the first actually-active node's identity — accurate even
  // for "backend", where that's now whichever specific service(s) are
  // really in scope, not a generic stand-in.
  const repKey = activeKeys.size ? [...activeKeys][0] : category;
  const info = BY_KEY[repKey] || { icon: "🤖", img: null, name: category || "idle" };
  const iconImg = document.getElementById("active-icon-img");
  if (info.img) iconImg.src = `/assets/images/${info.img}`;
  document.getElementById("active-name").textContent = activeKeys.size > 1 ? `${info.name} +${activeKeys.size - 1}` : info.name;
}

let lastSeq = 0;

async function poll() {
  const dot = document.getElementById("dot");
  try {
    const res = await fetch("/status.json", { cache: "no-store" });
    const data = await res.json();
    dot.classList.add("live");

    // Live text/highlight — refreshed by every output line, tracks who's
    // talking right now.
    const category = data.category || "orchestrator";
    setActiveCategory(category, data.keys);
    thinkingPaused = !!(data.lastEvent && PAUSE_ON_EVENTS.has(data.lastEvent.event));
    document.getElementById("active-message").textContent = data.message || "…";
    document.getElementById("active-updated").textContent = data.updatedAt
      ? "Updated " + new Date(data.updatedAt).toLocaleTimeString()
      : "";

    // "N of M" as a small badge, plus the task name filling the rest of the
    // line — the label's own CSS truncates it with an ellipsis if it's long.
    const progressText = data.taskProgress && data.taskProgress.current
      ? `${data.taskProgress.current}/${data.taskProgress.total}`
      : "";
    document.getElementById("status-progress").textContent = progressText;
    document.getElementById("status-task-name").textContent = data.task || "";

    // Session-limit reset time — a stable banner (not the volatile `message`
    // line, which the very next routine output line overwrites) that stays
    // up for as long as dev-loop.js reports this field, i.e. until the human
    // actually responds and the retry begins (see blockAndRetry() in
    // dev-loop.js).
    document.getElementById("session-limit-banner").textContent =
      data.sessionLimit && data.sessionLimit.resetsAt ? `⏳ Session limit hit — resets ${data.sessionLimit.resetsAt}` : "";

    // "Waiting for you" box — lets a human answer dev-loop.js's blocking
    // terminal prompt (session-limit retry, design-review APPROVED/feedback,
    // plan approval, ...) from here instead of switching to the terminal.
    // Only touches the prompt text / visibility when the prompt itself
    // actually changes, so a draft the human is mid-typing never gets wiped
    // out by the next 1-second poll.
    const respondBox = document.getElementById("respond-box");
    const respondPrompt = document.getElementById("respond-prompt");
    if (data.awaitingInput) {
      respondBox.classList.add("active");
      // expectsText === false is the "press Enter to retry, text is never
      // read" case (see askUserInput() in dev-loop.js) — show only the
      // Continue button, no textbox, so it's not implying typing matters.
      respondBox.classList.toggle("text-mode", data.awaitingInput.expectsText !== false);
      respondBox.classList.toggle("enter-mode", data.awaitingInput.expectsText === false);
      if (respondPrompt.dataset.prompt !== data.awaitingInput.prompt) {
        respondPrompt.dataset.prompt = data.awaitingInput.prompt;
        respondPrompt.textContent = data.awaitingInput.prompt;
      }
    } else {
      respondBox.classList.remove("active", "text-mode", "enter-mode");
      if (respondPrompt.dataset.prompt) {
        respondPrompt.dataset.prompt = "";
        document.getElementById("respond-text").value = "";
      }
    }

    // Audio cue — driven ONLY by `lastEvent`, which routine output can never
    // overwrite (see emitEvent()'s comment in dev-loop.js). Only a genuinely
    // NEW event (seq increased since the last poll) plays — re-fetching the
    // same still-current event on the next poll must never replay its sound.
    // While muted, `lastSeq` must NOT advance past an unplayed event — only
    // the very first poll after page load (lastSeq === 0) gets baselined so
    // we don't dump the whole history the moment sound is enabled. Any event
    // that arrives while still muted stays "unseen" and plays as soon as the
    // user clicks enable, instead of being silently lost.
    const evt = data.lastEvent;
    if (evt && evt.seq !== lastSeq) {
      if (soundEnabled) {
        lastSeq = evt.seq;
        playCue(audioFileFor(evt.event, evt.category));
      } else if (lastSeq === 0) {
        lastSeq = evt.seq;
      }
    }

  } catch {
    dot.classList.remove("live");
  }

  // Task-history data is fetched straight from its own file under docs/cost/
  // (a generic static route in dev-loop.js, not a shaped /status.json field)
  // — so changing what's shown here, or the file's own shape, never needs a
  // dev-loop.js restart again; only this page needs to reload. Kept in its
  // own try/catch so a hiccup here never breaks the live-status half above.
  try {
    const historyRes = await fetch("/docs/cost/task-history.json", { cache: "no-store" });
    const history = historyRes.ok ? await historyRes.json() : [];
    renderHistory(Array.isArray(history) ? history : []);
  } catch {
    // Files not written yet (nothing completed this run) — leave whatever
    // was last rendered (or the initial empty state) as-is.
  }
}

function renderHistory(fullHistory) {
  // Total is summed over the FULL history, not just the 30 rows the table
  // actually shows below — otherwise the total would silently under-report
  // once a project has completed more than 30 tasks.
  const totalUsd = fullHistory.reduce((sum, h) => sum + (h.totalCostUsd || 0), 0);
  const summaryEl = document.getElementById("cost-summary");
  summaryEl.innerHTML = fullHistory.length
    ? `<span>${fullHistory.length} task${fullHistory.length === 1 ? "" : "s"} completed</span><span id="cost-summary-total">$${totalUsd.toFixed(4)}</span>`
    : "";

  const history = fullHistory.slice(-30).reverse();
  const tbody = document.getElementById("history-tbody");
  if (!history.length) {
    tbody.innerHTML = '<tr><td colspan="2" id="history-empty">No completed tasks yet</td></tr>';
    return;
  }
  tbody.innerHTML = history.map((h) => `
    <tr>
      <td title="${h.task}">${h.task}</td>
      <td>${h.totalCostUsd.toFixed(4)}</td>
    </tr>
  `).join("");
}

setActiveCategory("orchestrator");
initDashboard().finally(() => {
  poll();
  setInterval(poll, 1000);
});
initDesignMockups();
</script>
</body>
</html>
