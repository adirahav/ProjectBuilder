<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dev Loop Desktop</title>
<style>
  :root {
    --bg: #0b0b10;
    --panel: #16161d;
    --border: #2a2a35;
    --text: #e6e6ec;
    --dim: #6b6b7a;
    --accent: #f0b429;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #layout { display: flex; flex-direction: column; height: 100vh; }
  #toolbar {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-shrink: 0;
  }
  #project-path { flex: 1; min-width: 0; font-size: 13px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button {
    font-size: 13px; font-weight: 600;
    padding: 7px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #1e1e28;
    color: var(--text);
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: default; }
  #status { font-size: 12px; color: var(--dim); padding: 0 16px; flex-shrink: 0; }
  #main-area { flex: 1; min-height: 0; position: relative; }
  #log {
    position: absolute; inset: 0;
    margin: 0; padding: 12px 16px;
    overflow-y: auto;
    font-family: "Cascadia Code", Consolas, monospace;
    font-size: 12px; line-height: 1.5;
    white-space: pre-wrap;
    color: #c8c8d0;
  }
  webview { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
  webview.active { display: inline-flex; }
  #log.hidden { display: none; }
</style>
</head>
<body>
<div id="layout">
  <div id="toolbar">
    <button id="pick-btn">Select Project Folder…</button>
    <span id="project-path">No project selected</span>
    <button id="start-btn" disabled>▶ Start</button>
    <button id="stop-btn" disabled>■ Stop</button>
  </div>
  <div id="status"></div>
  <div id="main-area">
    <pre id="log"></pre>
    <webview id="dashboard-view"></webview>
  </div>
</div>
<script src="renderer.js"></script>
</body>
</html>
