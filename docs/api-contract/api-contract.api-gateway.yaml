openapi: 3.0.3

info:
  title: api-gateway API
  version: 1.0.0
  description: >
    api-gateway is the single security boundary for every Admin route in the Dog
    Grooming Appointment Booking System. It verifies the Admin JWT and forwards
    the request to the service that owns the data.

    Scope of this revision: PRD F5 (`POST /api/auth/login`, proxied through to
    user-service), PRD F12 (`POST /api/auth/register`, also proxied through to
    user-service but — unlike login — gated by JWT verification), the Admin
    Service management routes F6-F8, and the Admin Appointment routes F9-F11 —
    the latter two proxied through to booking-service and gated by the gateway's
    JWT verification (AC-7).

    Read the two `/api/auth/*` routes together, because the difference between
    them is the whole security story of F12. `login` is the single deliberately
    public route on this gateway; `register` must NOT be. There is no
    self-service sign-up in this product — an existing Admin creates the next
    Admin's account from inside the dashboard. Mounting `verifyJwt` on the
    `/api/auth` prefix as a whole would lock login out; omitting it from
    `register` would let anyone on the internet mint a full Admin account. Gate
    the `register` route specifically, and leave a comment at the mount saying
    why the split exists.

    The public booking routes (F1-F4b) are NOT part of this contract: they are
    unauthenticated by design and the frontend calls booking-service directly.
    See docs/api-contract/api-contract.booking-service.yaml.

servers:
  - url: http://localhost:4000
    description: Local development

tags:
  - name: Auth
    description: >
      Admin authentication and Admin account creation, both forwarded to
      user-service.

      v1 seeds exactly one Admin account and lets a signed-in Admin create more
      (PRD F12). Every account created this way is a full Admin: there are no
      roles or permission tiers in v1, which is an accepted tradeoff rather than
      an oversight. Neither route may ever return a password or a password hash.
  - name: Admin Services
    description: >
      Admin-only management of the `Service` catalogue (PRD F6-F8). Every route
      here requires a valid Admin JWT and is forwarded to booking-service.

      The public, unauthenticated `GET /api/services` is deliberately NOT part
      of this contract: the frontend calls booking-service directly for it, and
      it must keep returning active services only. The admin list is a separate
      path (`/api/services/all`) rather than a flag on the public one, so a
      deactivated Service is never one misread query parameter away from the
      customer-facing screen.
  - name: Admin Appointments
    description: >
      Admin-only management of `Appointment` records (PRD F9-F11, Screen 7).
      Every route here requires a valid Admin JWT and is forwarded to
      booking-service.

      This is the most sensitive surface in the gateway: `GET /api/appointments`
      aggregates customer names, phone numbers and email addresses across every
      booking in the clinic in a single response, where the public receipt route
      exposes one booking to whoever already holds its id. It must have no
      unauthenticated path whatsoever.

      The public `POST /api/appointments` and `GET /api/appointments/{id}`
      (PRD F4/F4b) are deliberately NOT part of this contract and are not
      mounted here: the frontend calls booking-service directly for them. The
      mount below therefore does not shadow them.

components:
  responses:
    Unauthorized:
      description: >
        The Admin JWT is missing, malformed, or expired. Every Admin route must
        answer this — proving it is actually gated, not merely hidden behind a
        client-side route guard. The frontend treats it as a session expiry:
        it clears the stored token and returns to the Admin login screen.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Unauthorized

    ServiceNotFound:
      description: >
        No Service with that id exists — typically because another Admin, or
        another tab, removed it after this list was loaded. The frontend treats
        this as its own case rather than a generic failure: it says the record
        is gone and reloads the list, instead of offering a retry that could
        never succeed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Service not found

    AppointmentNotFound:
      description: >
        No Appointment with that id exists — typically because the list was
        loaded before the record was removed. The frontend treats this as its
        own case: it says the booking is gone and reloads the list, rather than
        offering a retry that could never succeed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Appointment not found

    AppointmentConflict:
      description: >
        The Appointment is not in a status this transition is allowed from —
        confirming something already `confirmed` or `cancelled`, or cancelling
        something already `cancelled`.

        This is the answer to a race, not to bad input: the transition is applied
        as a single conditional update matching on the current status, so of two
        near-simultaneous requests for the same transition exactly one succeeds
        and the other lands here. The frontend reloads the list and says the
        booking had already changed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Appointment is not pending

    BookingServiceUnavailable:
      description: >
        The gateway could not reach booking-service. Surfaced to the Admin as a
        generic "we could not save that" failure, never as a validation problem
        with what they typed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Booking service unavailable

  securitySchemes:
    adminJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        The token issued by `POST /api/auth/login`. Sent as
        `Authorization: Bearer <token>` on every Admin route. api-gateway
        verifies it and rejects a missing, malformed, or expired token with 401
        before the request reaches any downstream service.

        The Admin Service routes below are the first routes actually gated by
        it. The frontend attaches the header to every request it makes once a
        token is stored, and treats any 401 outside the login endpoint as a
        session expiry: it clears the stored token and returns to the login
        screen.

  schemas:
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 254
          description: >
            The Admin's email address or username — PRD Screen 5 allows either,
            so the server must accept both on this one field rather than
            requiring an email format.
          example: admin@example.com
        password:
          type: string
          minLength: 1
          format: password
          description: >
            Sent as typed, with no client-side trimming: leading and trailing
            spaces are legitimate password characters. Must never be logged,
            echoed back in a response, or included in an error message.
          example: correct-horse-battery-staple
      additionalProperties: false

    Admin:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
          description: The Admin's client-facing id. Mongo's `_id` must never be exposed.
          example: 3d0f1a2b-4c5d-4e6f-8091-a2b3c4d5e6f7
        email:
          type: string
          format: email
          example: admin@example.com
      additionalProperties: false

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 60
          description: >
            The new Admin's display name. Collected because F12 asks for it and
            because with more than one account on record, an email address alone
            is a poor way to tell colleagues apart.
          example: Dana Levi
        email:
          type: string
          format: email
          maxLength: 254
          description: >
            The identifier the new account will sign in with. Must be unique.
            The frontend lower-cases and trims it before sending, so that
            "Dana@Example.com" and "dana@example.com" cannot become two
            accounts; the server must normalise independently rather than trust
            that, and should store and compare it case-insensitively.

            Note this field is a real email, unlike LoginRequest.identifier,
            which also accepts a username: login has to accept whatever the
            seeded account was given, but this route is what defines a new
            account, so it can insist on an address that can actually be
            checked for typos.
          example: dana@example.com
        password:
          type: string
          minLength: 8
          maxLength: 72
          format: password
          description: >
            Sent as typed, with no client-side trimming: leading and trailing
            spaces are legitimate password characters. Hashed with bcrypt before
            storage. Must never be logged, echoed back in a response, or
            included in an error message.

            The 72-byte ceiling is bcrypt's: it silently ignores anything past
            it, so a longer password would quietly not be the password the Admin
            thinks they set.
          example: correct-horse-battery-staple
      additionalProperties: false

    StaffAccount:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
          description: The account's client-facing id. Mongo's `_id` must never be exposed.
          example: 9f8e7d6c-5b4a-4321-8765-0a1b2c3d4e5f
        name:
          type: string
          example: Dana Levi
        email:
          type: string
          format: email
          example: dana@example.com
      additionalProperties: false

    RegisterResponse:
      type: object
      required: [admin]
      properties:
        admin:
          $ref: '#/components/schemas/StaffAccount'
      additionalProperties: false
      description: >
        The created account's public fields, and nothing else. No password, no
        password hash, and deliberately no token: creating an account for
        somebody else must not issue a session, and must not disturb the session
        of the Admin who created it. The new account signs in for itself through
        `POST /api/auth/login`, immediately — v1 has no activation or invite
        step.

    LoginResponse:
      type: object
      required: [token, admin]
      properties:
        token:
          type: string
          description: >
            A signed JWT carrying the Admin's id and a fixed admin role claim,
            with a bounded expiry (24 hours). There is no refresh token in v1:
            when it expires, the Admin signs in again. The frontend stores it
            and never inspects its contents.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.<payload>.<signature>
        admin:
          $ref: '#/components/schemas/Admin'
      additionalProperties: false

    Service:
      type: object
      required: [id, name, durationMinutes, price, isActive]
      properties:
        id:
          type: string
          format: uuid
          description: >
            The Service's client-facing identifier (the model's `uuid`). Mongo's
            `_id` must never appear in a response — the frontend types have no
            field for it and every write path below addresses records by this id.
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        name:
          type: string
          minLength: 1
          maxLength: 60
          example: Full groom
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 480
          description: >
            Whole minutes only. TimeSlot boundaries are generated from this, so
            a fractional duration would put every slot off the clock. The
            frontend rejects a non-integer before sending; the server must
            reject it too.
          example: 90
        price:
          type: number
          minimum: 0
          maximum: 100000
          description: >
            In shekels. Zero is valid — a complimentary treatment is a real
            case — so an absent price must never be coerced to 0.
          example: 220
        isActive:
          type: boolean
          description: >
            False means soft-deleted: the record still exists and existing
            Appointments still reference it, but it no longer appears on the
            public `GET /api/services` list. There is no hard delete.
          example: true
      additionalProperties: false

    ServiceDraft:
      type: object
      required: [name, durationMinutes, price]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          example: Bath and brush
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 480
          example: 45
        price:
          type: number
          minimum: 0
          maximum: 100000
          example: 120
      description: >
        The create payload. It carries no `isActive`: a newly created Service is
        always active, and letting the client ask for an inactive one would only
        produce a record nobody can see or reach.
      additionalProperties: false

    ServicePatch:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 480
        price:
          type: number
          minimum: 0
          maximum: 100000
        isActive:
          type: boolean
          description: >
            Patchable on purpose. Deactivation has its own endpoint, but
            re-activating a soft-deleted Service has none, so this is the only
            route back.
      description: >
        A partial update: the server applies exactly the fields present and
        leaves the rest alone. The frontend sends only what the Admin actually
        changed, so an untouched field can never overwrite another Admin's edit.
        An empty object must be rejected as 400 — it is a request that cannot
        accomplish anything.
      additionalProperties: false

    AdminAppointment:
      type: object
      description: >
        One booking as the Admin sees it (PRD F9). It is the stored Appointment
        plus the two joined display objects the list is actually read by — a
        person scans "Full groom, Tuesday 09:00", not a pair of ids.

        Both joins are optional, and the frontend renders a row without either
        one: a Service or TimeSlot removed underneath an existing booking must
        still leave a readable row. Omitting a fact is honest; inventing one is
        not. They must be omitted entirely rather than sent as null.

        This shape carries customer PII and has no unauthenticated route.
      required: [id, serviceId, timeSlotId, customerName, customerPhone, status]
      properties:
        id:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
        timeSlotId:
          type: string
          format: uuid
        customerName:
          type: string
        customerPhone:
          type: string
          description: >
            Free-form as the Customer typed it, not normalized to E.164 — the
            Admin dials it, and the frontend renders it as a `tel:` link.
        customerEmail:
          type: string
          format: email
          description: Optional at booking time; absent, never an empty string.
        status:
          type: string
          enum: [pending, confirmed, cancelled]
        service:
          type: object
          description: Joined from `serviceId` for display.
          properties:
            name:
              type: string
            durationMinutes:
              type: integer
            price:
              type: number
        timeSlot:
          type: object
          description: Joined from `timeSlotId` for display.
          properties:
            date:
              type: string
              format: date
              description: The calendar day, `YYYY-MM-DD`.
            startTime:
              type: string
              pattern: '^[0-2][0-9]:[0-5][0-9]$'
              description: Local wall-clock time, `HH:mm`.
            endTime:
              type: string
              pattern: '^[0-2][0-9]:[0-5][0-9]$'
      example:
        id: 7c1f9a2e-4d3b-4a51-9f6c-2b8e0d5a7c31
        serviceId: 1b2c3d4e-5f60-4718-9a2b-3c4d5e6f7a8b
        timeSlotId: 9e8d7c6b-5a49-4382-b1c0-d9e8f7a6b5c4
        customerName: Dana Levi
        customerPhone: 050-123-4567
        status: pending
        service:
          name: Full groom
          durationMinutes: 90
          price: 220
        timeSlot:
          date: '2026-08-18'
          startTime: '09:00'
          endTime: '10:30'

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: >
            A short, safe message. It must never distinguish "no such account"
            from "wrong password", and must never echo the submitted password.
          example: Invalid credentials
      additionalProperties: false

paths:
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: loginAdmin
      summary: Exchange Admin credentials for a JWT
      description: >
        PRD F5. Proxied by api-gateway through to user-service, which looks the
        Admin up by email or username, compares the submitted password against
        the stored bcrypt hash, and signs a JWT on a match.

        This is the one route on the gateway that is NOT behind JWT
        verification, since it is how the token is obtained in the first place.

        Timing and messaging must not leak account existence: a request for an
        unknown identifier and a request with the wrong password must both
        return the same 401 body.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: The credentials matched. The JWT is issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: >
            The identifier or the password is missing. Distinct from 401: the
            request was never a well-formed login attempt, so no credential
            check happened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Identifier and password are required
        '401':
          description: >
            The credentials were rejected — unknown identifier OR wrong
            password, deliberately indistinguishable. The frontend treats this
            as an expected outcome of the login form: it renders an inline
            message beside the form and, uniquely for this route, does NOT
            trigger the global session-expiry redirect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid credentials
        '502':
          description: >
            The gateway could not reach user-service. Surfaced to the Admin as a
            generic "we could not sign you in" failure, never as a credential
            problem.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Authentication service unavailable

  /api/auth/register:
    post:
      tags: [Auth]
      operationId: registerAdmin
      summary: Create an additional Admin/staff account
      description: >
        PRD F12, Screen 8 (AC-10). An already-signed-in Admin creates another
        Admin account. Proxied by api-gateway through to user-service, which
        checks the email is not already taken, hashes the password with bcrypt,
        and inserts an account identical in shape to the seeded one.

        THIS ROUTE MUST BE BEHIND `verifyJwt`. It is the mirror image of
        `POST /api/auth/login` above, which is public: this one is not, and the
        PRD names an open version of it as a security regression to be rejected
        in review. There is no `/signup`, no public `/register`, and no
        unauthenticated path to account creation anywhere in this system. A
        request without a valid Admin JWT must be answered 401 before it reaches
        user-service.

        The same trust boundary as every other route applies downstream:
        user-service performs no JWT check of its own and trusts that the
        gateway already did, so user-service must not be reachable directly from
        outside the internal network.

        The created account is a full Admin and can sign in immediately. v1 has
        no roles, no invite link and no activation step — the creating Admin
        shares the password out of band.
      security:
        - adminJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: >
            The account was created. The response carries only its public
            fields — never the password or its hash, and never a token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: >
            A field is missing or malformed: no name, no email, an email that is
            not an address, or a password below the minimum length. Distinct
            from 409: nothing about the existing accounts was consulted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Name, email and password are required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: >
            An account already exists for that email. The frontend treats this
            as an expected outcome of the form rather than a fault: it renders
            an inline message beside the form asking for a different address,
            and leaves what was typed in place.

            The message names the field and stops there — it must not reveal who
            owns the existing account, whether it is active, or when it was
            created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: An account with that email already exists
        '502':
          description: >
            The gateway could not reach user-service. Surfaced to the Admin as a
            generic "we could not create the account" toast, never as a problem
            with what they typed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Authentication service unavailable

  /api/services/all:
    get:
      tags: [Admin Services]
      operationId: listAllServices
      summary: List every Service, active and deactivated alike
      description: >
        PRD F6-F8, Screen 6. The Admin view of the catalogue: unlike the public
        `GET /api/services` on booking-service, this applies no `isActive`
        filter, because showing the deactivated records is the entire point of
        the screen.

        Forwarded to booking-service after the JWT is verified. The frontend
        keeps the result in a store slice separate from the public list, so a
        soft-deleted Service can never render on a customer-facing screen.
      security:
        - adminJwt: []
      responses:
        '200':
          description: >
            Every Service on record. An empty array is a valid, non-error answer
            — a clinic that has not added a treatment yet — and the frontend
            renders it as an empty state, not a failure.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/BookingServiceUnavailable'

  /api/services:
    post:
      tags: [Admin Services]
      operationId: createService
      summary: Create a Service
      description: >
        PRD F6. The created Service is always active; the payload carries no
        `isActive` and the server must not accept one.

        The frontend validates the same rules client-side before sending, so a
        400 here means the two sides disagree — the server remains the only side
        that decides, and its rejection must not be assumed impossible.
      security:
        - adminJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceDraft'
      responses:
        '201':
          description: >
            The Service was created. The body is the stored record, including
            its server-assigned `id` and `isActive: true` — the frontend puts
            exactly this into its list and never the draft it sent, since only
            the response proves the write happened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          description: >
            The name is missing/blank, or the duration or price is missing,
            non-numeric, or out of range. The duration must additionally be a
            whole number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Name, durationMinutes and price are required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/BookingServiceUnavailable'

  /api/services/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The Service's client-facing `id` (its `uuid`), never Mongo's `_id`.
        schema:
          type: string
          format: uuid
    patch:
      tags: [Admin Services]
      operationId: updateService
      summary: Update the given fields of a Service
      description: >
        PRD F7. A partial update: apply exactly the fields present in the body
        and leave every other field as stored. A PUT-style full replacement is
        deliberately not offered — it would let a stale form silently revert a
        field another Admin changed in the meantime.

        Setting `isActive: true` here is the supported way to offer a
        deactivated Service again; there is no separate reactivate route.
      security:
        - adminJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicePatch'
      responses:
        '200':
          description: The updated Service, as stored after the patch was applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          description: >
            The body is empty, or a field that is present fails validation.
            Fields that are absent must not be validated — omitting the name is
            not the same as blanking it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: durationMinutes must be a whole number of minutes
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ServiceNotFound'
        '502':
          $ref: '#/components/responses/BookingServiceUnavailable'

  /api/services/{id}/deactivate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Admin Services]
      operationId: deactivateService
      summary: Stop offering a Service (soft delete)
      description: >
        PRD F8. Sets `isActive: false` and nothing else. It is a soft delete:
        the record survives so Appointments already booked against it stay
        readable, it simply stops appearing on the public `GET /api/services`
        list.

        It must not cascade — existing TimeSlot and Appointment records for this
        Service are left exactly as they are.

        Its own endpoint rather than a `PATCH /api/services/{id}` with
        `isActive: false`, so the intent is explicit in the routing and in the
        server's logs. No request body.
      security:
        - adminJwt: []
      responses:
        '200':
          description: The Service, now with `isActive: false`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ServiceNotFound'
        '502':
          $ref: '#/components/responses/BookingServiceUnavailable'

  /api/appointments:
    get:
      tags: [Admin Appointments]
      operationId: listAppointments
      summary: Every Appointment on record, optionally narrowed
      description: >
        PRD F9. Returns all Appointments — every status, including `cancelled` —
        joined with their Service and TimeSlot for display.

        The two filters are independent and both optional: absent means "do not
        narrow by this", never "match empty". An absent filter must not be read
        as an empty-string match. The frontend omits a malformed value entirely
        rather than forwarding it, so a value that does arrive is well-formed.

        Ordering is not relied upon: the frontend sorts by the slot's date and
        start time itself, soonest first.

        This response aggregates customer PII across the whole clinic. It must be
        unreachable without a valid Admin JWT — that gate is the single reason
        this route exists at the gateway rather than being called directly.
      security:
        - adminJwt: []
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: >
            A single calendar day, `YYYY-MM-DD`, matched against the linked
            TimeSlot's date. Past days are valid — the Admin genuinely needs to
            look back at yesterday.
          example: '2026-08-18'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, confirmed, cancelled]
          description: Narrows to one status. An unrecognized value is a 400.
      responses:
        '200':
          description: >
            The matching Appointments. An empty array is a valid, successful
            answer — an empty diary and a filter that matched nothing are both
            200, and the frontend tells them apart by whether a filter is set.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminAppointment'
        '400':
          description: A filter value is present but unparseable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: status must be one of pending, confirmed, cancelled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/BookingServiceUnavailable'

  /api/appointments/{id}/confirm:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Admin Appointments]
      operationId: confirmAppointment
      summary: Confirm a pending Appointment
      description: >
        PRD F10. Transitions `pending` -> `confirmed` and nothing else. No
        request body.

        Applied as a single conditional update matching on the current status,
        so a booking that moved on in another tab answers 409 rather than being
        silently re-confirmed. It must not touch the linked TimeSlot: the slot is
        already `booked`, and confirming is the Admin agreeing to honour it.

        Reversible by the cancel route below, which is why the frontend asks for
        no extra confirmation before calling this.
      security:
        - adminJwt: []
      responses:
        '200':
          description: >
            The updated Appointment, now `confirmed`. The joined `service` and
            `timeSlot` are welcome but not required here — the frontend merges
            this response into the row it already holds rather than replacing it,
            so a bare Appointment cannot blank out the row's service name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAppointment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/AppointmentNotFound'
        '409':
          $ref: '#/components/responses/AppointmentConflict'
        '502':
          $ref: '#/components/responses/BookingServiceUnavailable'

  /api/appointments/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Admin Appointments]
      operationId: cancelAppointment
      summary: Cancel an Appointment and release its TimeSlot
      description: >
        PRD F11. Transitions `pending` or `confirmed` -> `cancelled`, and
        releases the linked TimeSlot back to `open` so the time returns to the
        public picker. No request body.

        Both source statuses are allowed, exactly as F11 states: a pending
        booking the Admin does not want to honour must be cancellable without
        first confirming it.

        The slot release is the server's job and is not a second call from the
        client — a client that cancelled the booking and then failed its second
        request would strand a time nobody can ever book. Order the two writes so
        the Appointment's conditional transition is the precondition, and treat a
        slot that is missing or already `open` as a no-op success rather than a
        failure that blocks the cancel: the Appointment's own status is the more
        important source of truth for the Admin's action.

        Two near-simultaneous cancels of the same Appointment must produce
        exactly one `cancelled` transition and one 409 — never a double release
        of the same TimeSlot.

        There is no un-cancel route; the PRD specifies confirm and cancel only.
      security:
        - adminJwt: []
      responses:
        '200':
          description: The updated Appointment, now `cancelled`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAppointment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/AppointmentNotFound'
        '409':
          $ref: '#/components/responses/AppointmentConflict'
        '502':
          $ref: '#/components/responses/BookingServiceUnavailable'
